[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "aeo-fixture-desk-core"
version = "0.0.2"
edition = "2021"
rust-version = "1.80"

[lib]
name = "aeo_fixture_desk_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
